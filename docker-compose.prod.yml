# Production: database + API + website + Caddy (HTTPS otomatis) di satu VPS.
# Jalankan:  docker compose -f docker-compose.prod.yml up -d --build
# Isi variabel di file .env (salin dari .env.production.example).
name: mental-english

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: mental_english
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mental -d mental_english']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://mental:${POSTGRES_PASSWORD}@db:5432/mental_english
      DB_SYNC: 'false'
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: https://${DOMAIN}
      PUBLIC_URL: https://${DOMAIN}/api
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?isi DOMAIN di .env}/api
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Server-side rendering memanggil API lewat jaringan internal Docker
      API_URL: http://api:4000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
