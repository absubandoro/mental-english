# Template untuk domain MILIK KLIEN, mis. mentalenglish.id. Satu file per domain.
#   sudo cp deploy/nginx-klien.conf /etc/nginx/sites-available/klien-mentalenglish.id
#   sudo sed -i 's/DOMAIN_KLIEN/mentalenglish.id/g' /etc/nginx/sites-available/klien-mentalenglish.id
#   sudo ln -s /etc/nginx/sites-available/klien-mentalenglish.id /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mentalenglish.id -d www.mentalenglish.id     # HTTPS + perpanjangan otomatis
#
# Domain juga harus didaftarkan di panel pengelola (Lembaga -> Alamat website).
# Bila domain klien berupa subdomain (mis. belajar.kursus.com), hapus blok "www" di bawah
# dan jalankan certbot hanya untuk domain itu.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_KLIEN;

    include /etc/nginx/snippets/nofosys-proxy.conf;
}

# www.DOMAIN_KLIEN -> DOMAIN_KLIEN
server {
    listen 80;
    listen [::]:80;
    server_name www.DOMAIN_KLIEN;
    return 301 $scheme://DOMAIN_KLIEN$request_uri;
}
