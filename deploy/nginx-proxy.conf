# Aturan proxy bersama untuk semua domain Nofosys (platform & klien).
# Salin:  sudo cp deploy/nginx-proxy.conf /etc/nginx/snippets/nofosys-proxy.conf

# Batas unggahan: gambar 8 MB, video 100 MB (dibatasi lagi oleh API)
client_max_body_size 110m;
client_body_timeout 300s;

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

# API NestJS: https://domain/api/... -> 127.0.0.1:4000/...  (termasuk file unggahan /api/uploads/...)
location /api/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    # Host asli diteruskan: dari sinilah lembaga (klien) dikenali
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Website Next.js
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
