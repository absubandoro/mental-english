# Nginx untuk platform Nofosys: domain platform + SEMUA subdomain klien (<slug>.nofosys.id).
# Butuh sertifikat wildcard (langkah 9 DEPLOY.md) dan snippet proxy:
#   sudo cp deploy/nginx-proxy.conf /etc/nginx/snippets/nofosys-proxy.conf
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nofosys
# Ganti SEMUA "nofosys.id" di file ini dengan domain platform Anda.
#
# Domain milik klien (mis. mentalenglish.id) TIDAK ditaruh di sini — pakai deploy/nginx-klien.conf.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nofosys.id *.nofosys.id;
    return 301 https://$host$request_uri;
}

server {
    # Nginx 1.25+ (mis. Ubuntu 26.04) menampilkan peringatan "http2 is deprecated" — aman diabaikan,
    # atau ganti dua baris listen ini dengan "listen 443 ssl;" + "listen [::]:443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nofosys.id *.nofosys.id;

    ssl_certificate     /etc/letsencrypt/live/nofosys.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nofosys.id/privkey.pem;

    include /etc/nginx/snippets/nofosys-proxy.conf;
}
