# Nginx untuk Mental English.
# Salin:   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mental-english
# Ganti mentalenglish.id dengan domain Anda, lalu aktifkan (lihat DEPLOY.md).
# HTTPS dipasang otomatis oleh Certbot (sudo certbot --nginx -d DOMAIN).

server {
    listen 80;
    listen [::]:80;
    server_name mentalenglish.id;

    # Batas unggahan: gambar 8 MB, video 100 MB (dibatasi lagi oleh API)
    client_max_body_size 110m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API NestJS: https://domain/api/... -> 127.0.0.1:4000/...
    # (termasuk foto unggahan: /api/uploads/...)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        # Unggah video besar lewat koneksi lambat
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Website Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
